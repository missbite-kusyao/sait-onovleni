
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Block ♡</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #fff0f5;
    font-family: "Georgia", serif;
    color: #75465b;
}

.one {
    width: 70%;
    background: #ffd6e7;
    margin-top: 10%;
    margin-left: 15%;
    padding: 40px 25px;
    border: 2px dashed #d98eae;
    border-radius: 25px;
    box-shadow: 8px 8px 0 #f5b8d0;
    text-align: center;
    position: relative;
}

h1 {
    color: #b75c86;
    font-size: 28px;
}

p {
    font-size: 17px;
    line-height: 1.8;
}

.decor {
    font-size: 24px;
    color: #c778a0;
}

a {
    color: #a84e78;
    text-decoration: none;
}
</style>
</head>

<body>
    <div class="one">
        <div class="decor">୨୧ ♡ ୨୧</div>
        <h1>♡ little angel ♡</h1>

        <p>
            A tiny dream wrapped in pink lace.
            <br>
            Soft hearts, silver stars and
            <br>
            a little bit of magic.
        </p>

        <div class="decor">୨୧ ₊˚⊹♡</div>
    </div>
</body>
</html>
